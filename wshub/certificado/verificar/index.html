<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#06162b"><title>Verificar certificado | WS Hub</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 90% 0%,#14425d,transparent 60%),#06162b;color:#f6faff;font:15px/1.6 system-ui,sans-serif;padding:18px}.card{width:min(520px,100%);border:1px solid #557795;border-top:3px solid #f4c860;border-radius:14px;background:#0e2b49;padding:28px}h1{font-size:26px;margin:3px 0 18px}strong{color:#f4c860}p{margin:11px 0}a{color:#f3ce77} .little{font-size:11px;color:#aec5d5}</style></head><body><main class="card"><div class="little">WS HUB · CERTIFICAÇÃO DIGITAL</div><h1>Verificação de certificado</h1><p id="result">Consultando o registro…</p><div id="detail" hidden></div><p class="little">O registro confirma que um certificado foi emitido pelo WS Hub. A identificação informada pelo participante não comprova presença ou identidade sem verificação adicional.</p><a href="/wshub/">Voltar ao WS Hub</a></main>
<script>(()=>{'use strict';const id=new URLSearchParams(location.search).get('id')||'';const result=document.getElementById('result'),box=document.getElementById('detail');
if(!/^cert-[a-f0-9-]{36}$/.test(id)){result.textContent='Identificador inválido.';return}
fetch('https://ws-hub-api.dell-soares.workers.dev/api/publico/certificados/verificar?id='+encodeURIComponent(id),{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.erro||'Não encontrado');return d}).then(d=>{result.innerHTML='<strong>Registro encontrado e válido.</strong>';box.hidden=false;
 for(const [label,val] of [['Participante',d.certificado.nome],['Formação',d.certificado.titulo],['Carga horária',d.certificado.horas+' horas'],['Emitido em',new Date(d.certificado.emitidoEm).toLocaleString('pt-BR')],['Identificador',d.certificado.id]]){
  const p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=label+': ';p.append(strong,document.createTextNode(val||''));box.append(p)}
}).catch(e=>{result.textContent=e.message||'Certificado não localizado.'});})();</script>
</body></html>
